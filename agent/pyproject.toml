[project]
name = "ancient-architecture-agent"
version = "2.0.0"
description = "Local LangGraph ReAct service for ancient architecture"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.8,<3", "httpx>=0.28,<1", "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4", "langchain-core>=1,<2", "langchain-deepseek>=1,<2",
  "aiosqlite>=0.21,<1",
  "numpy>=2,<3", "pypdf>=5,<7", "pillow>=11,<13", "sse-starlette>=2,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.uv]
package = false
